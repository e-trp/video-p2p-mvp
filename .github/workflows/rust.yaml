name: Rust CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: |
          cargo test --all --all-features
          cargo test -p app-core --example playback_probe --all-features
          cargo test -p capture-macos --example capture_probe --all-features

      - name: Install Node for viewer tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test viewer signaling and playback lifecycle
        run: node --test apps/desktop/tests/viewer-player.test.mjs scripts/probe-cleanup.test.mjs

      - name: Test native macOS sample extraction
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-capture.sh
